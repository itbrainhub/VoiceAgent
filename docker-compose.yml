services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: voiceagent
      POSTGRES_PASSWORD: voiceagent
      POSTGRES_DB: voiceagent
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://voiceagent:voiceagent@db:5432/voiceagent
    ports: ["8000:8000"]
    depends_on: [db]

  worker:
    build: .
    command: python -m app.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://voiceagent:voiceagent@db:5432/voiceagent
    depends_on: [db]

volumes:
  pgdata:
